<!doctype html>

<html lang="pt-pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css">
  <title>Vai Chover na Próxima Hora?</title>
</head>

<body>

<div class="conteiner">
  <h1>Vai Chover na Próxima Hora?</h1>
  <div class="card" role="regiao" aria-label="Contagem regressiva para chuva">

    <div class="label">
      Tempo Restante para a Decisão:
    </div>

    <div id="tempo" class="tempo">60:00</div>
    
    <div class="decisao-label">Decisão Atual:</div>

    <div id="decisao" class="decisao sim">SIM</div>


    <div id="next" class="rodape">
      A próxima decisão será tomada em 60:00
    </div>

  </div>

</div>  

  <script src="script.js"></script>

</body>
</html>
